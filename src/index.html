<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="{{ siteTitle }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cyntler.com" />
    <meta property="og:image" content="./assets/favicon-280x280.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link
      id="favicon-ico"
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32 48x48"
      href="./assets/favicon.ico"
    />
    <link
      id="favicon-16"
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon-16x16.png"
    />
    <link
      id="favicon-32"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link
      id="favicon-48"
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="./assets/favicon-48x48.png"
    />
    <link
      id="favicon-svg"
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="./assets/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="./assets/safari-pinned-tab.svg"
      color="#000000"
    />
    <script type="module" src="./favicon.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./index.scss" />
    <title>{{ siteTitle }}</title>
  </head>
  <body>
    <a href="/"><img src="./assets/logo.svg" alt="{{ titleAboutMe }}" /></a>
    <h1>{{ titleAboutMe }}</h1>
    <p>{{{ myHistoryContent }}}</p>
    <p>{{{ whatDoContent }}}</p>
    <p>
      <a
        href="mailto:damian@cyntler.com"
        target="_blank"
        rel="noopener noreferrer"
        >Mail</a
      >
      /
      <a
        href="https://linkedin.com/in/cyntler"
        target="_blank"
        rel="noopener noreferrer"
        >LinkedIn</a
      >
      /
      <a
        href="https://github.com/cyntler"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
      /
      <a
        href="{{ cvUrl }}"
        target="_blank"
        rel="noopener noreferrer"
        >CV</a
      >
    </p>
    <div class="version">v{{ version }}</div>
  </body>
</html>
